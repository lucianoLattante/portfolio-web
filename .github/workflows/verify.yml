name: Verify portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:pages
      - name: Verify browser interactions
        env:
          PORTFOLIO_TEST_BASE_PATH: /portfolio-web
          PORTFOLIO_BROWSER_TOOLS: ${{ runner.temp }}/portfolio-browser
        run: |
          npm install --prefix "$PORTFOLIO_BROWSER_TOOLS" --no-save --ignore-scripts playwright@1.58.2
          node "$PORTFOLIO_BROWSER_TOOLS/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
          node --test scripts/verify-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-static-export
          include-hidden-files: true
          path: out/
          if-no-files-found: error
